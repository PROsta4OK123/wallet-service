spring.application.name=wallet-service
spring.main.keep-alive=true
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5433/wallet
spring.datasource.username=wallet
spring.datasource.password=wallet
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.connection-init-sql=SET statement_timeout TO 5000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus,ledgerReconciliation
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

wallet.funding-scheduler.enabled=${FUNDING_SCHEDULER_ENABLED:true}
wallet.funding-scheduler.fixed-delay=${FUNDING_SCHEDULER_DELAY:60000}
wallet.funding-scheduler.batch-size=${FUNDING_SCHEDULER_BATCH_SIZE:100}

server.error.include-message=never
server.error.include-stacktrace=never

logging.pattern.level=%5p [requestId:%X{requestId:-none}]
